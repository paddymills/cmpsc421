<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div id="app">
    <p>One way data binding</p>
    <p>name: {{name}}</p>
    <p>job: {{job}}</p>
    <p>Our website: {{website}}</p>

</div>

<script src="vue.global.js"></script>
<script src="app.js"></script>

</body>
</html>
