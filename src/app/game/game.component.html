<div class="game-container">
  <div class="game-board">
    <!-- row 1 -->
    <div class="game-cell" id="draw-pile">
      <app-pile [cards]="deck" />
    </div>
    <div class="game-cell" id="waste-pile">
      <app-pile [cards]="waste" />
    </div>
    <div class="game-cell" id="spades-pile">
      <app-pile [cards]="spadesPile" />
    </div>
    <div class="game-cell" id="clubs-pile">
      <app-pile [cards]="clubsPile" />
    </div>
    <div class="game-cell" id="hearts-pile">
      <app-pile [cards]="heartsPile" />
    </div>
    <div class="game-cell" id="diamonds-pile">
      <app-pile [cards]="diamondsPile" />
    </div>

    <!-- row 2 -->
    <div class="game-cell game-pile">
      <app-pile [cards]="tableau[0]" />
    </div>
    <div class="game-cell game-pile">
      <app-pile [cards]="tableau[1]" />
    </div>
    <div class="game-cell game-pile">
      <app-pile [cards]="tableau[2]" />
    </div>
    <div class="game-cell game-pile">
      <app-pile [cards]="tableau[3]" />
    </div>
    <div class="game-cell game-pile">
      <app-pile [cards]="tableau[4]" />
    </div>
    <div class="game-cell game-pile">
      <app-pile [cards]="tableau[5]" />
    </div>
    <div class="game-cell game-pile">
      <app-pile [cards]="tableau[6]" />
    </div>
  </div>
</div>
