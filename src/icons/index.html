<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>


    <script src="https://cdn.jsdelivr.net/npm/@materializecss/materialize@2.2.1/dist/js/materialize.min.js"></script>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@materializecss/materialize@2.2.1/dist/css/materialize.min.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <!-- Material Symbols - Outlined Set -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <!-- Material Symbols - Rounded Set -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet"/>
    <!-- Material Symbols - Sharp Set -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp" rel="stylesheet"/>

</head>
<body>


<div class="container">
    <h4>Icons</h4>
    <i class="material-icons red-text">ac_unit</i>
    <i class="material-icons yellow-text">error</i>
    <i class="material-icons grey-text">cloud</i>
    <i class="material-icons light-blue-text">folder</i>

    <h4>icons on buttons</h4>
    <a href="#" class="btn indigo" id="send_button">
        <span>send</span>
        <i class="material-icons right">send</i>
    </a>
    <a href="#" class="btn pink">
        <i class="material-icons left">email</i>
        <span>email</span>
    </a>

    <h4>Icons on Floating BUttons</h4>
    <a href="#" class="btn-floating red pulse">
        <i class="material-icons">add</i>
    </a>
    <a href="#" class="btn-floating light-blue pulse">
        <i class="material-icons">edit</i>
    </a>
    <a href="#" class="btn-floating orange pulse">
        <i class="material-icons">remove</i>
    </a>
</div>


</body>
</html>
