<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Games DB</title>


    <script src="https://cdn.jsdelivr.net/npm/@materializecss/materialize@2.2.1/dist/js/materialize.min.js" integrity="sha256-PJJZSjhhE//mITZJf3mCMixskOuajAyHKctYLvsGNMY=" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@materializecss/materialize@2.2.1/dist/css/materialize.min.css" integrity="sha256-FyggsEnDaIf/m3jLI9zPWHEttxfcEc9QPF+9Iqjr7eE=" crossorigin="anonymous">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!-- Material Symbols - Outlined Set -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <!-- Material Symbols - Rounded Set -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
    <!-- Material Symbols - Sharp Set -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp" rel="stylesheet" />

    <style>

         body {
             min-height: 1000px;
             padding-bottom: 200px;
         }

         img#logo {
             width: 650px;
             display: block;
             margin: 0 auto 0 auto;
             border: 2px solid green;
         }

         ::-webkit-input-placeholder { /* Chrome/Opera/Safari */
             color: pink;
         }
         ::-moz-placeholder { /* Firefox 19+ */
             color: pink;
         }
         :-ms-input-placeholder { /* IE 10+ */
             color: pink;
         }
         :-moz-placeholder { /* Firefox 18- */
             color: pink;
         }

         i:hover {
             cursor: pointer;
         }

    </style>

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

</head>
<body>

<div class="container">

    <h2>Video Games DB</h2>
    <img id="logo" src="https://cdn.wallpapersafari.com/20/59/z1JNkm.jpg" alt="mario kart">

    <h4>Add a new game to the database</h4>
    <form>

        <label for="vg_title">Video Game Title: </label>
        <input type="text" id="vg_title" placeholder="e.g. Witcher 3">
        <label for="vg_year">Video Game Year: </label>
        <input type="text" id="vg_year" placeholder="e.g. 2015">
        <label for="vg_publisher">Video Game Publisher: </label>
        <input type="text" id="vg_publisher" placeholder="e.g. Warner Bros.">
        <label for="vg_developer">Video Game Developer: </label>
        <input type="text" id="vg_developer" placeholder="e.g. CD Project Red">
        <button type="button" class="btn-large blue white-text">Add</button>
    </form>

    <h4>View the data</h4>
    <ul class="collection">
        <li class="collection-item">
            <i class="material-icons secondary-content red-text" title="click me to delete">delete</i>
            <i class="material-icons secondary-content blue-text" title="click me to edit">edit</i>
            <span class="title">Red Dead Redemption</span>
            <p class="grey-text">Rockstar (2009)</p>
        </li>
        <li class="collection-item">
            <i class="material-icons secondary-content red-text" title="click me to delete">delete</i>
            <i class="material-icons secondary-content blue-text" title="click me to edit">edit</i>
            <span class="title">Call of Duty Black Ops 6</span>
            <p class="grey-text">Activision (2024)</p>
        </li>
        <li class="collection-item">
            <i class="material-icons secondary-content red-text" title="click me to delete">delete</i>
            <i class="material-icons secondary-content blue-text" title="click me to edit">edit</i>
            <span class="title">Fortnite</span>
            <p class="grey-text">Epic Games (2017)</p>
        </li>


    </ul>




</div>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js" integrity="sha256-qXBd/EfAdjOA2FGrGAG+b3YBn2tn5A6bhz+LSgYD96k=" crossorigin="anonymous"></script>

<script>

    $(document).ready(() => {

        $('button').click(() => {
            Toastify({
                text: "This is a toast",
                duration: 3000,
                destination: "https://github.com/apvarun/toastify-js",
                newWindow: true,
                close: true,
                gravity: "top", // `top` or `bottom`
                position: "left", // `left`, `center` or `right`
                stopOnFocus: true, // Prevents dismissing of toast on hover
                style: {
                    background: "linear-gradient(to right, #00b09b, #96c93d)",
                },
                onClick: function(){} // Callback after click
            }).showToast();
        })

    });

</script>

</body>
</html>
