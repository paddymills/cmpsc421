<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <p id="main_paragraph">HTML is fun!</p>
    <script>

        // debugging
        console.log("Hello World!");

        // variables
        var x = 5;  // not recommended (global variable)
        let y = 10;  // recommended (local variable)
        const z = 15;  // constant (cannot be changed)

        // get the contents of the paragraph
        let paragraph = document.getElementById("main_paragraph");
        console.log(paragraph);

        // onnly want the html
        console.log(paragraph.innerHTML);

        //  change the paragraph
        function changeParagraph() {
            paragraph.innerHTML = "JavaScript is fun!";
            paragraph.style.color = 'red';
            paragraph.style.fontSize = '24px';
            paragraph.style.backgroundColor = 'yellow';
        }
        // changeParagraph();
        window.setTimeout(changeParagraph, 3000);

    </script>

</body>
</html>
