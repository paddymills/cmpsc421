<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Title</title>
</head>
<body>
	<p id="main_paragraph">HTML is fun!</p>
	<script>
		// debugging
		console.log("Hello, World!");

		// variables
		var x = 5;	// not recommended (global)
		let y = 10;	// recommended (local)
		const z = 15;	// constant

		// get the paragraph contents
		const changeParagraph = () => {
			let paragraph = document.getElementById("main_paragraph");
			console.log(paragraph);
			console.log(paragraph.innerHTML);

			paragraph.innerHTML = "JavaScript is fun!";
			paragraph.style.color = "red";
			paragraph.style.fontSize = "24px";
			paragraph.style.backgroundColor = "yellow";
		}

		window.setTimeout(changeParagraph, 3000);
	</script>
</body>
</html>
