<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Weather</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
        />
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <h1>Weather</h1>
            <form id="weather-form">
                <label for="zip-input">Zip Code</label>
                <input
                    type="text"
                    id="zip-input"
                    name="zip-input"
                    placeholder="Enter a zip code"
                />
                <button
                    type="button"
                    id="generate-btn"
                    class="btn-large blue white-text"
                >
                    Fetch Weather
                </button>
            </form>
            <div id="weather-data" class="light-blue lighten-2" hidden>
                <div id="progress" class="progress hidden">
                  <div class="indeterminate"></div>
                </div>
                <p id="weather-location"></p>
                <div id="weather-info" class="row">
                    <div class="col s1 offset-s1">
                        <img id="weather-icon" src="">
                    </div>
                    <div class="col s2">
                        <p id="weather-temp"></p>
                        <p id="weather-description"></p>
                    </div>
                    <div class="col s6">
                        <p id="weather-precip"></p>
                        <p id="weather-wind"></p>
                        <p id="weather-humidity"></p>
                    </div>
                </div>
                <div id="forecasts">
                    <div id="daily-forecasts" class="row"></div>
                    <div id="hourly-forecast" class="white"></div>
                </div>
            </div>
        <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
        <script src="app.js"></script>
    </body>
</html>
