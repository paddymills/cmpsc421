<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Weather</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
        />
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <h1>Weather</h1>
            <form id="weather-form">
                <label for="zip-input">Zip Code</label>
                <input
                    type="text"
                    id="zip-input"
                    name="zip-input"
                    placeholder="Enter a zip code"
                />
                <button
                    type="button"
                    id="generate-btn"
                    class="btn-large blue white-text"
                >
                    Fetch Weather
                </button>
            </form>
            <div id="weather-data" class="light-blue lighten-2" hidden>
                <p id="weather-location"></p>
                <div class="row">
                    <div class="col s1">
                        <img id="weather-icon" src="">
                    </div>
                    <div class="col s2">
                        <p id="weather-temp"></p>
                    </div>
                    <div class="col s6">
                        <p id="weather-precip"></p>
                        <p id="weather-wind"></p>
                        <p id="weather-humidity"></p>
                    </div>
                </div>
                <div class="row">
                <div id="daily-0" class="col s1 white lighten-4 forecast-day">
                    <p id="date-0"></p>
                    <img id="icon-0" src="">
                    <p id="temp-0"></p>
                </div>
                <div id="daily-1" class="col s1 blue-grey lighten-4 forecast-day">
                    <p id="date-1"></p>
                    <img id="icon-1" src="">
                    <p id="temp-1"></p>
                </div>
                <div id="daily-2" class="col s1 blue-grey lighten-4 forecast-day">
                    <p id="date-2"></p>
                    <img id="icon-2" src="">
                    <p id="temp-2"></p>
                </div>
                <div id="daily-3" class="col s1 blue-grey lighten-4 forecast-day">
                    <p id="date-3"></p>
                    <img id="icon-3" src="">
                    <p id="temp-3"></p>
                </div>
                <div id="daily-4" class="col s1 blue-grey lighten-4 forecast-day">
                    <p id="date-4"></p>
                    <img id="icon-4" src="">
                    <p id="temp-4"></p>
                </div>
                <div id="daily-5" class="col s1 blue-grey lighten-4 forecast-day">
                    <p id="date-5"></p>
                    <img id="icon-5" src="">
                    <p id="temp-5"></p>
                </div>
                <div id="daily-6" class="col s1 blue-grey lighten-4 forecast-day">
                    <p id="date-6"></p>
                    <img id="icon-6" src="">
                    <p id="temp-6"></p>
                </div>
                <div id="daily-7" class="col s1 blue-grey lighten-4 forecast-day">
                    <p id="date-7"></p>
                    <img id="icon-7" src="">
                    <p id="temp-7"></p>
                </div>
                <div id="daily-8" class="col s1 blue-grey lighten-4 forecast-day">
                    <p id="date-8"></p>
                    <img id="icon-8" src="">
                    <p id="temp-8"></p>
                </div>
                <div id="daily-9" class="col s1 blue-grey lighten-4 forecast-day">
                    <p id="date-9"></p>
                    <img id="icon-9" src="">
                    <p id="temp-9"></p>
                </div>
            </div>
            <div id="hourly-forecast"></div>
        <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
        <script src="app.js"></script>
    </body>
</html>
