<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Title</title>
</head>
<body>
	<h2>Block level elements</h2>
	<!-- Block level element -->
	<h1>Hello to my cool website</h1>
	<p>I hope you enjoy your time here.</p>
	<p>here is a blue box</p>
	<div style="width: 100px; height: 100px; background-color: blue;"></div>

	<h2>inline elements</h2>
	<!-- Inline element -->
	<a href="https://psu.edu">This is an inline link to psu</a>
	<img src="https://picsum.photos/200/300" alt="A cute kitten" />

	<h2>Changing inline to block</h2>
	<a style="display: block;" href="https://google.com">google</a>
	<a style="display: block;" href="https://reddit.com">reddit</a>

	<h2>Changing block to inline</h2>
	<p style="display: inline;">It was the best of time</p>
	<p style="display: inline;">It was the worst of times</p>
</body>
</html>
