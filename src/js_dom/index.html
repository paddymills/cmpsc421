<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Title</title>
	<style type="text/css">
#main_img {
	width: 50%;
	border: 1px solid black;
}
h1#main_header {
	display: none;
}
	</style>
</head>
<body>
	<h1 id="main_header">This is a header</h1>
	<img id="main_img" src="https://imgs.xkcd.com/comics/devotion_to_duty.png" alt="sysadmin">
	<button onclick="buttonClick()">Click me</button>
	<script type="text/javascript">
		function loadPage() {
			// alert("loaded");
			let img = document.getElementById("main_img");
			img.alt = "danger";
			img.src = "https://imgs.xkcd.com/comics/dangers.png";

			let header = document.getElementById("main_header");
			header.style.display = "block";
			header.textContent = "Welcome to the page";

			document.body.style.backgroundColor = "lightblue";
		}

		const buttonClick = () => {
			alert("Button clicked");
		}

		setTimeout(loadPage, 2000);
	</script>
</body>
</html>
