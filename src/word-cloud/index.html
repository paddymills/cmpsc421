<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Word Cloud</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <h1>Word Cloud</h1>
            <form id="words-form">
                <label for="word-input">Word</label>
                <input
                    type="text"
                    id="word-input"
                    name="word-input"
                    placeholder="Enter a word"
                />
                <button
                    type="button"
                    id="generate-btn"
                    class="btn-large blue white-text"
                >
                    Generate
                </button>
            </form>
            <div class="cloud">
                <svg></svg>
            </div>
        </div>
        <!-- <script src="https://cdn.jsdelivr.net/npm/d3@7"></script> -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.5/d3.min.js"
            type="text/javascript"
        ></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.5/d3.layout.cloud.min.js"
            type="text/javascript"
        ></script>
        <script src="app.js" type="text/javascript"></script>
    </body>
</html>
